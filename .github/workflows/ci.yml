name: CI

on:
  push:
    branches: [main, OrsBranch]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Verify dependency consistency
        run: pip check

      - name: Django system checks
        run: python manage.py check
        env:
          # test_settings sets its own deterministic DJANGO_SECRET_KEY, so
          # no dummy key is needed here.
          DJANGO_SETTINGS_MODULE: shoeshopper.test_settings

      - name: Run backend tests
        run: python -m pytest backend/tests --cov=backend
